<!doctype html>
<html lang="es" data-theme="malva">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Mia</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#F6F2F9" />
    <link rel="icon" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mia" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      [data-theme="malva"] {
        --bg: #f6f2f9;
        --ink: #2b2336;
        --mut: #675c77;
        --ac: #7a5ba6;
        --line: #ddd2e8;
        --soft: #e7dff0;
      }
      [data-theme="salvia"] {
        --bg: #f4f6f1;
        --ink: #24302a;
        --mut: #5e6b62;
        --ac: #4f7a63;
        --line: #d5ddd2;
        --soft: #dde5da;
      }
      [data-theme="rosa"] {
        --bg: #faf2f3;
        --ink: #35242a;
        --mut: #765a62;
        --ac: #a8566a;
        --line: #ebd5d9;
        --soft: #f2e0e3;
      }
      [data-theme="azul"] {
        --bg: #f1f5f8;
        --ink: #1f2c38;
        --mut: #566675;
        --ac: #4f6f8f;
        --line: #d3dee7;
        --soft: #dce6ee;
      }
      [data-theme="terracota"] {
        --bg: #faf3ef;
        --ink: #38251f;
        --mut: #7a5a50;
        --ac: #b5573f;
        --line: #ebd9d0;
        --soft: #f2e2da;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.4 Inter,
          system-ui,
          sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 28px) 24px
          calc(170px + env(safe-area-inset-bottom));
      }
      .sf {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
      }
      .lb {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--mut);
        text-transform: uppercase;
      }
      h1 {
        font-size: 38px;
        line-height: 1.1;
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border: 0;
        border-top: 1px solid var(--line);
        width: 100%;
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .tx {
        background: none;
        border: 0;
        color: var(--ac);
        font-weight: 600;
        min-height: 44px;
        padding: 0 6px;
        cursor: pointer;
      }
      .wk {
        display: flex;
      }
      .wk button {
        flex: 1;
        min-height: 44px;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--mut);
        cursor: pointer;
      }
      .wk .on {
        border-bottom: 2px solid var(--ac);
        color: var(--ac);
        font-weight: 700;
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--soft);
      }
      .bar i {
        display: block;
        height: 4px;
        border-radius: 2px;
        background: var(--ac);
      }
      .cta {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 48px);
        max-width: 432px;
        bottom: calc(96px + env(safe-area-inset-bottom));
        height: 52px;
        border: 0;
        border-radius: 26px;
        background: var(--ac);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 8px 0 env(safe-area-inset-bottom);
      }
      nav button {
        flex: 1;
        background: none;
        border: 0;
        min-height: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--mut);
        cursor: pointer;
      }
      nav .on {
        color: var(--ac);
        font-weight: 700;
      }
      .bd {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 480px;
        margin: auto;
        background: var(--bg);
        border-radius: 24px 24px 0 0;
        padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 22px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: var(--mut);
      }
      input {
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
        font: inherit;
        font-size: 16px;
        background: #fff;
        color: var(--ink);
      }
      .bt {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .bt button {
        min-height: 48px;
        padding: 0 18px;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      .bt .pri {
        background: var(--ac);
        border: 0;
        color: #fff;
        font-weight: 600;
      }
      .bt .del {
        color: #b3261e;
      }
      .chip {
        min-height: 44px;
        padding: 0 14px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: #fff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .chip.ok {
        background: var(--ac);
        color: #fff;
        border: 0;
      }
      small {
        color: var(--mut);
      }
      .sheet {
        max-height: 92dvh;
        overflow: auto;
        z-index: 10;
      }
      .bd {
        z-index: 9;
      }
      textarea {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        font-size: 16px;
        background: #fff;
        color: var(--ink);
        resize: none;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 12px;
        border-radius: 14px;
        background: var(--soft);
        color: var(--ac);
        font-size: 13px;
        font-weight: 700;
      }
      .ex {
        display: block;
        padding-bottom: 12px;
        transition: transform 0.15s;
        -webkit-user-select: none;
        user-select: none;
      }
      .ex .bub {
        margin: 0;
      }
      .ex.drag {
        position: relative;
        z-index: 2;
        transition: none;
      }
      .ex.drag .bub {
        box-shadow: 0 10px 28px rgba(43, 35, 54, 0.22);
      }
      .hdl {
        width: 40px;
        border: 0;
        background: none;
        color: var(--mut);
        cursor: grab;
        touch-action: none;
        font-size: 18px;
        letter-spacing: -3px;
      }
      .cn {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 8px 0 4px;
      }
      .cn button {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--ac);
        font-size: 24px;
        cursor: pointer;
      }
      .cg {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
      }
      .cg small {
        padding: 4px 0;
      }
      .cd {
        height: 40px;
        border: 0;
        border-radius: 20px;
        background: none;
        cursor: pointer;
        font-size: 15px;
      }
      .cd.in {
        background: var(--soft);
        border-radius: 0;
      }
      .cd.on {
        background: var(--ac);
        color: #fff;
        font-weight: 700;
      }
      .cd.td {
        box-shadow: inset 0 0 0 1px var(--ac);
      }
      .cc {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 8px 12px;
        text-align: left;
        cursor: pointer;
      }
      .cc.on {
        border-color: var(--ac);
        box-shadow: 0 0 0 1px var(--ac);
      }
      .cc small,
      .cc b {
        display: block;
      }
      .sec {
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .sheet input,
      .sheet textarea {
        width: 100%;
        min-width: 0;
      }
      .g2 > * {
        min-width: 0;
      }
      .btn {
        min-height: 48px;
        padding: 0 18px;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        color: var(--ink);
      }
      .btn.p {
        background: var(--ac);
        border: 0;
        color: #fff;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .msg {
        background: var(--soft);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        margin: 8px 0;
      }
      .er {
        color: #b3261e;
        font-size: 14px;
        margin: 0;
      }
      .bub {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 14px 16px;
        box-shadow: 0 2px 10px rgba(43, 35, 54, 0.07);
        margin: 0 0 12px;
        font: inherit;
        color: inherit;
      }
      .ico {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--ac);
        display: grid;
        place-items: center;
        flex: none;
      }
      .ib {
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--ac);
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        border-radius: 22px;
        padding: 0;
      }
      .bt .ib {
        border: 0;
        background: none;
        padding: 0;
        width: 48px;
        color: #b3261e;
      }
      .wk button {
        opacity: 0.5;
      }
      .wk .on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"><main id="main"></main></div>
    <nav>
      <button data-a="v" data-v="g">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 10h18M7 15h4" /></svg
        >Gastos</button
      ><button data-a="v" data-v="r">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12" /></svg
        >Gimnasio</button
      ><button data-a="v" data-v="s">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"
          /></svg
        >Suscripciones</button
      ><button data-a="v" data-v="a">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"
          /></svg
        >Ajustes
      </button>
    </nav>
    <div id="sh"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        K = "mia-app",
        VERSION = "6.0.0",
        TH = ["malva", "salvia", "rosa", "azul", "terracota"],
        USD = 41.5,
        M = [
          "Enero",
          "Febrero",
          "Marzo",
          "Abril",
          "Mayo",
          "Junio",
          "Julio",
          "Agosto",
          "Septiembre",
          "Octubre",
          "Noviembre",
          "Diciembre",
        ],
        DN = [
          "domingo",
          "lunes",
          "martes",
          "miércoles",
          "jueves",
          "viernes",
          "sábado",
        ];
      const pad = (n) => String(n).padStart(2, "0"),
        iso = (d) =>
          d.getFullYear() +
          "-" +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getDate()),
        today = () => iso(new Date()),
        pd = (v) => new Date(v + "T00:00:00"),
        addD = (v, n) => {
          const d = pd(v);
          d.setDate(d.getDate() + n);
          return iso(d);
        },
        addM = (v) => {
          const d = pd(v);
          d.setMonth(d.getMonth() + 1);
          return iso(d);
        },
        dd = (a, b) => Math.round((pd(b) - pd(a)) / 864e5),
        fecha = (f) =>
          +f.slice(8) + " " + M[+f.slice(5, 7) - 1].slice(0, 3).toLowerCase(),
        dim = (y, m) => new Date(y, m, 0).getDate(),
        lastBill = (day, t) => {
          let y = +t.slice(0, 4),
            m = +t.slice(5, 7);
          const d = +t.slice(8),
            b = Math.min(day, dim(y, m));
          if (d >= b) return y + "-" + pad(m) + "-" + pad(b);
          m--;
          if (m < 1) {
            m = 12;
            y--;
          }
          return y + "-" + pad(m) + "-" + pad(Math.min(day, dim(y, m)));
        },
        paid = (s) => !!s.paidAt && !(lastBill(s.d, today()) > s.paidAt);
      const inP = (p, f) => f >= p.a && f <= p.b,
        weekIn = (p, f) => Math.min(5, Math.floor(dd(p.a, f) / 7) + 1);
      function migrate() {
        let o;
        try {
          o = JSON.parse(localStorage.getItem("mia-v2"));
        } catch (e) {}
        if (!o || !o.periods) return null;
        const n = {
            theme: o.theme || "malva",
            cash: o.cash || 0,
            gastos: [],
            sem: {},
            per: [],
            sel: null,
            rut: [],
            subs: [],
          },
          ym = today().slice(0, 7);
        o.periods.forEach((p) => {
          const q = { id: p.id, a: p.start, b: p.end };
          n.per.push(q);
          (p.weeks || []).forEach((w) => {
            n.sem[p.id + "-" + w.n] = w.budget;
            (w.exps || []).forEach((e) =>
              n.gastos.push({
                id: e.id,
                f:
                  e.at && inP(q, e.at) && weekIn(q, e.at) == w.n
                    ? e.at
                    : addD(p.start, 7 * (w.n - 1)),
                d: e.desc,
                m: e.amount,
              }),
            );
          });
        });
        (o.routines || []).forEach((r) =>
          n.rut.push({
            id: r.id,
            n: r.name,
            d: r.day || "",
            e: (r.ex || []).map((e) => ({
              id: e.id,
              n: e.name,
              s: e.sets,
              r: e.reps,
              w: e.weight,
              t: e.notes,
            })),
          }),
        );
        (o.subs || []).forEach((s) =>
          n.subs.push({
            id: s.id,
            n: s.name,
            d: s.day,
            p: s.amount,
            paidAt:
              (s.pays || []).includes(ym) || s.paid === ym ? today() : null,
          }),
        );
        return n;
      }
      let S;
      try {
        S = JSON.parse(localStorage.getItem(K));
      } catch (e) {}
      S = S ||
        migrate() || {
          theme: "malva",
          cash: 0,
          gastos: [],
          sem: {},
          per: [],
          sel: null,
          rut: [],
          subs: [],
        };
      const save = () => {
          try {
            localStorage.setItem(K, JSON.stringify(S));
          } catch (e) {}
        },
        uid = () => Math.random().toString(36).slice(2, 9),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        money = (n) =>
          (n < 0 ? "-" : "") +
          "$ " +
          Math.abs(Math.round(n || 0)).toLocaleString("es-UY");
      let view = "g",
        wk = null,
        open = null,
        cashEd = false,
        gOpen = false,
        bk = "";
      document.documentElement.dataset.theme = S.theme;
      const per = () => S.per.find((p) => p.id == S.sel) || null,
        sorted = () => [...S.per].sort((x, y) => x.a.localeCompare(y.a)),
        fixSel = () => {
          if (!per()) {
            const t = today(),
              l = sorted();
            S.sel =
              (l.find((p) => inP(p, t)) || l[l.length - 1] || {}).id ?? null;
          }
        };
      const ic = (p, s = 20) =>
          `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`,
        PEN =
          '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
        TRASH =
          '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
        DL =
          '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
        UL = '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>',
        DB = '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
        ib = (a, l, x = "") =>
          `<button class="ib" data-a="${a}" ${x} aria-label="${l}" title="${l}">${ic(PEN)}</button>`;
      const hd = (lb, t) =>
        `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px"><div><div class="lb">${lb}</div><h1 class="sf">${t}</h1></div><button class="tx" data-a="th">Color</button></div>`;
      function gastos() {
        const p = per();
        if (!p)
          return (
            hd("Tarjeta de crédito", "Gastos") +
            '<p><small>Todavía no creaste ningún período. Elegí desde el calendario cuándo empieza y cuándo termina.</small></p><button class="cta" data-a="ap">Crear período</button>'
          );
        const w = wk || (inP(p, today()) ? weekIn(p, today()) : 1),
          L = S.gastos.filter((g) => inP(p, g.f)),
          W = L.filter((g) => weekIn(p, g.f) == w).sort((a, b) =>
            b.f.localeCompare(a.f),
          ),
          sp = W.reduce((a, g) => a + g.m, 0),
          bu = S.sem[p.id + "-" + w] || 0,
          left = bu - sp,
          tot = L.reduce((a, g) => a + g.m, 0),
          l = sorted(),
          ix = l.indexOf(p),
          ar = (a, t, d) =>
            `<button class="tx" data-a="${a}" aria-label="${t === "‹" ? "Período anterior" : "Período siguiente"}" ${d ? 'disabled style="opacity:.35"' : ""}>${t}</button>`;
        return (
          hd("Tarjeta de crédito", M[+p.a.slice(5, 7) - 1]) +
          `<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">${ar("pp", "‹", ix == 0)}<b>${fecha(p.a)} – ${fecha(p.b)} ${p.b.slice(0, 4)}</b>${ar("np", "›", ix == l.length - 1)}</div>` +
          `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="badge">${DN[pd(p.a).getDay()]}</span><span style="display:flex;align-items:center">${ib("ep", "Editar período")}<button class="tx" data-a="ap">+ Período</button></span></div>` +
          `<div class="wk">${[1, 2, 3, 4, 5].map((i) => `<button data-a="w" data-i="${i}" class="${i == w ? "on" : ""}">Sem ${i}</button>`).join("")}</div>` +

          r = items.map((x) => x.getBoundingClientRect()),
          i = items.indexOf(it);
        dr = {
          it,
          items,
          i,
          to: i,
          y: e.clientY,
          rid: h.dataset.h,
          top: r.map((x) => x.top),
          hs: r.map((x) => x.height),
        };
        it.classList.add("drag");
        h.setPointerCapture(e.pointerId);
      });
      document.addEventListener("pointermove", (e) => {
        if (!dr) return;
        const dy = e.clientY - dr.y,
          { items, i, hs, top } = dr,
          c = top[i] + hs[i] / 2 + dy;
        let to = 0;
        items.forEach((_, k) => {
          if (k != i && top[k] + hs[k] / 2 < c) to++;
        });
        dr.to = to;
        dr.it.style.transform = `translateY(${dy}px)`;
        items.forEach((x, k) => {
          if (k != i)
            x.style.transform =
              i < to && k > i && k <= to
                ? `translateY(${-hs[i]}px)`
                : i > to && k < i && k >= to
                  ? `translateY(${hs[i]}px)`
                  : "";
        });
      });
      const dend = () => {
        if (!dr) return;
        const r = S.rut.find((x) => x.id == dr.rid),
          ids = dr.items.map((c) => c.dataset.i),
          m = ids.splice(dr.i, 1)[0];
        ids.splice(dr.to, 0, m);
        r.e.sort(
          (a, b) => ids.indexOf(String(a.id)) - ids.indexOf(String(b.id)),
        );
        dr = null;
        save();
        render();
      };
      document.addEventListener("pointerup", dend);
      document.addEventListener("pointercancel", dend);
      if (swOK)
        navigator.serviceWorker.register("sw.js").then((r) => {
          U.reg = r;
          if (r.waiting && navigator.serviceWorker.controller) {
            U.avail = true;
            U.msg = "Hay una nueva versión de Mia lista para instalar.";
          }
          r.addEventListener("updatefound", () => {
            const n = r.installing;
            n &&
              n.addEventListener("statechange", () => {
                if (
                  n.state == "installed" &&
                  navigator.serviceWorker.controller
                ) {
                  U.avail = true;
                  U.msg = "Hay una nueva versión de Mia lista para instalar.";
                } else if (n.state == "redundant") {
                  U.err = "No se pudo descargar la nueva versión.";
                }
                if (view == "a") render();
              });
          });
        });
      async function chk() {
        if (!U.reg || U.checking) return;
        U.checking = true;
        U.err = U.msg = "";
        render();
        try {
          await U.reg.update();
          await new Promise((r) => setTimeout(r, 2000));
          if (U.reg.waiting) {
            U.avail = true;
            U.msg = "Hay una nueva versión de Mia lista para instalar.";
          } else if (!U.avail) U.msg = "Mia ya está actualizada.";
        } catch (e) {
          U.err = "No se pudo buscar una actualización.";
        }
        U.checking = false;
        render();
      }
      function inst() {
        const w = U.reg && U.reg.waiting;
        if (!w) return location.reload();
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          () => location.reload(),
          { once: true },
        );
        w.postMessage("SKIP_WAITING");
      }
      addEventListener("popstate", (e) => {
        open = (e.state && e.state.r) || null;
        render();
      });
      render();
    </script>
  </body>
