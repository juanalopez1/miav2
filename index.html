<!doctype html><html lang="es" data-theme="malva"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mia</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F6F2F9"><link rel="icon" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mia"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=malva]{--bg:#F6F2F9;--ink:#2B2336;--mut:#675C77;--ac:#7A5BA6;--line:#DDD2E8;--soft:#E7DFF0}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}

#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(180px + env(safe-area-inset-bottom))}
.sf{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.lb{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
h1{font-size:36px;line-height:1.1;margin:0;display:flex;align-items:center;gap:10px}

.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:8px}
.sec{border-top:1px solid var(--line);padding:16px 0}

.row.nb{border-top:0}

.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sel{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:14px;font-weight:600}
.wk{display:flex;overflow-x:auto}.wk button{flex:1;min-width:64px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:0;border-bottom:1px solid var(--line);color:var(--mut);cursor:pointer;white-space:nowrap}.wk button small{font-size:11px}.wk .on{border-bottom:2px solid var(--ac);color:var(--ac);font-weight:700}.wk .on small{color:var(--ac)}
.bar{height:4px;border-radius:2px;background:var(--soft)}.bar i{display:block;height:4px;border-radius:2px;background:var(--ac)}
.cta{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:432px;bottom:calc(96px + env(safe-area-inset-bottom));height:52px;border:0;border-radius:26px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;z-index:4}
.cta:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);cursor:pointer}nav .on{color:var(--ac);font-weight:700}
.grp{border-top:1px solid var(--line)}
.acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ex{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--bg);transition:transform .15s;-webkit-user-select:none;user-select:none}
.ex.drag{box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;z-index:2;transition:none}
.hdl{width:44px;border:0;background:none;color:var(--mut);cursor:grab;touch-action:none;font-size:18px;letter-spacing:-3px}
.exb{flex:1;background:none;border:0;text-align:left;padding:12px 0;cursor:pointer;display:flex;gap:12px;min-width:0}
.num{width:28px;height:28px;border-radius:14px;background:var(--soft);color:var(--ac);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.row2{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);min-height:60px}
.row2.off{opacity:.6}
.gr{flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:8px 0;min-height:44px}.gr b{display:block;font-weight:500}.gr small{display:block}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer}.chip.ok{background:var(--ac);color:#fff;border:0}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;z-index:10;max-height:92dvh;overflow:auto}
.sheet h3{margin:0;font-size:24px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.ck{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
input:not([type=checkbox]),textarea{border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink);min-height:48px;width:100%}
textarea{padding:10px 12px;resize:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bt button,.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;color:var(--ink)}.bt .pri{background:var(--ac);border:0;color:#fff;font-weight:600}.bt .del{color:#B3261E}
.er{color:#B3261E;font-size:14px;margin:0}
.sw{display:flex;gap:12px;padding:8px 0}.sw button{width:44px;height:44px;border-radius:22px;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--ink)}
.msg{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.big{font-size:56px;line-height:1}.cn{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}.cn button{width:44px;height:44px;border:0;background:none;color:var(--ac);font-size:24px;cursor:pointer}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg small{padding:4px 0}.cd{height:40px;border:0;border-radius:20px;background:none;cursor:pointer;font-size:15px}.cd.in{background:var(--soft);border-radius:0}.cd.on{background:var(--ac);color:#fff;font-weight:700}.cd.td{box-shadow:inset 0 0 0 1px var(--ac)}.cc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer}.cc.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.cc small,.cc b{display:block}.wdc{display:flex;gap:6px}.wdc button{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px}.wdc .on{background:var(--ac);color:#fff;border:0;font-weight:700}
</style></head><body><div id="app"><main id="main"></main></div>
<nav id="nav"></nav><div id="sh"></div>
<script>
const VERSION='4.0.0',K='mia-v2',TH=['malva','salvia','rosa','azul','terracota'],THC={malva:'#7A5BA6',salvia:'#4F7A63',rosa:'#A8566A',azul:'#4F6F8F',terracota:'#B5573F'},UYU_USD=41.5,
MS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({theme:'malva',cash:0,wd:null,rate:41.5,periods:[],sel:null,routines:[],subs:[],seq:1},S||{});
S.subs.forEach(s=>{if(!s.pays)s.pays=s.paid?[s.paid]:[]});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},nid=()=>S.seq++,
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
money=n=>(n<0?'-':'')+'$ '+Math.abs(Math.round(n||0)).toLocaleString('es-UY'),pad=n=>String(n).padStart(2,'0'),
iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date()),pd=v=>new Date(v+'T00:00:00'),
addD=(v,n)=>{const d=pd(v);d.setDate(d.getDate()+n);return iso(d)},addM=v=>{const d=pd(v);d.setMonth(d.getMonth()+1);return iso(d)},
fs=v=>new Intl.DateTimeFormat('es-UY',{day:'2-digit',month:'short'}).format(pd(v)).replace('.','').replace('-',' '),
fd=v=>new Intl.DateTimeFormat('es-UY',{day:'2-digit',month:'short',year:'numeric'}).format(pd(v)),
mn=v=>MS[+v.slice(5,7)-1],DS=['dom','lun','mar','mié','jue','vie','sáb'],WP=['domingos','lunes','martes','miércoles','jueves','viernes','sábados'],fsw=v=>DS[pd(v).getDay()]+' '+fs(v),
nextWd=(v,d)=>{let x=addD(v,1);while(pd(x).getDay()!=d)x=addD(x,1);return x},
wr=(p,n)=>{const f=pd(p.start).getDay()==p.wd?addD(p.start,7):nextWd(p.start,p.wd),st=i=>i==1?p.start:addD(f,7*(i-2)),b=n<5?addD(st(n+1),-1):addD(st(5),6);return [st(n),b>p.end?p.end:b]};
S.periods.forEach(p=>{if(p.wd==null)p.wd=pd(p.start).getDay()});
document.documentElement.dataset.theme=S.theme;
const SP=(()=>{let d='';for(let t=.3;t<=13;t+=.2){const r=(1.6*t+1)*1.55;d+=(d?'L':'M')+(46.1+r*Math.cos(t)).toFixed(1)+' '+(53.9+r*Math.sin(t)).toFixed(1)}return d})();
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${SP}"/></svg>`,
ico=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`,
NAV=[['g','Gastos','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'],['r','Gimnasio','<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'],['s','Suscripciones','<path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"/>'],['a','Ajustes','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>']];
/* datos */
const cp=()=>{const t=today(),s=[...S.periods].sort((a,b)=>b.start.localeCompare(a.start));return s.find(p=>p.start<=t&&t<=p.end)||s[0]||null},
fixSel=()=>{if(!S.periods.some(p=>p.id==S.sel))S.sel=cp()?.id??null},
sp=w=>w.exps.reduce((a,e)=>a+e.amount,0),av=w=>w.budget-sp(w),
nextN=p=>p.weeks.length?Math.max(...p.weeks.map(w=>w.n))+1:1,
curW=p=>{if(!p||!p.weeks.length)return null;const t=today();return p.weeks.find(w=>{const r=wr(p,w.n);return r[0]<=t&&t<=r[1]})||[...p.weeks].reverse().find(w=>wr(p,w.n)[0]<=t)||p.weeks[0]},
canWeek=p=>{const n=nextN(p);return n<=5&&wr(p,n)[0]<=p.end};
let view='g',wkSel=null,ymS=today().slice(0,7),open=null,cashEd=false;
const per=()=>S.periods.find(x=>x.id==S.sel)||null,Wk=()=>{const p=per();return p&&(p.weeks.find(x=>x.n==wkSel)||curW(p))};
const hd=(lb,t,sm)=>`<div class="ph"><div><div class="lb">${lb}</div><h1 class="sf">${t}</h1>${sm?`<small>${sm}</small>`:''}</div></div>`,empty=t=>`<p class="mut">${t}</p>`;
/* gastos */
function gastos(){
 const ps=[...S.periods].sort((a,b)=>b.start.localeCompare(a.start)),p=per();
 if(!p)return hd('Tarjeta de crédito','Gastos')+empty('Todavía no creaste ningún período. Elegí desde el calendario cuándo empieza y cuándo termina.')+'<button class="cta" data-a="ap">Crear período</button>';
 const w=Wk(),nn=nextN(p),ok=canWeek(p),y=p.end.slice(0,4),ms=mn(p.start)==mn(p.end)&&p.start.slice(0,4)==y?mn(p.start)+' '+y:mn(p.start).slice(0,3)+' – '+mn(p.end).slice(0,3)+' '+y;
 let h=hd('Tarjeta de crédito',ms,'Empieza el '+fsw(p.start)+' · termina el '+fsw(p.end))+`<div class="crow"><select class="sel" data-a="sp" aria-label="Período">${ps.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${fs(x.start)} – ${fs(x.end)}</option>`).join('')}</select><button class="tx" data-a="ep">Editar</button><button class="tx" data-a="ap">+ Período</button></div>`+
 `<div class="wk">${p.weeks.map(x=>`<button data-a="ws" data-n="${x.n}" class="${w&&x.n==w.n?'on':''}"><span>Sem ${x.n}</span><small>${fs(wr(p,x.n)[0])}</small></button>`).join('')}${ok?`<button data-a="aw" style="color:var(--ac)"><span>+ Sem ${nn}</span><small>${fs(wr(p,nn)[0])}</small></button>`:''}</div>`;
 if(!w)return h+empty('Este período todavía no tiene semanas. Las semanas empiezan los '+WP[p.wd]+'. Creá la primera con su presupuesto.')+'<button class="cta" data-a="aw">Crear semana 1</button>';
 const r=wr(p,w.n),s=sp(w),l=av(w),T=p.weeks.reduce((a,x)=>a+sp(x),0),TA=p.weeks.reduce((a,x)=>a+av(x),0);
 return h+`<div style="padding:14px 0 8px"><small style="display:block;margin-bottom:10px">Semana ${w.n}: del ${fsw(r[0])} al ${fsw(r[1])} · las semanas empiezan los ${WP[p.wd]}</small><div class="lb">Te queda esta semana</div><div class="sf big" style="color:${l<0?'#B3261E':'var(--ink)'}">${money(l)}</div><div class="bar" style="margin-top:14px"><i style="width:${w.budget?Math.min(100,s/w.budget*100):0}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><small>Gastado ${money(s)} de ${money(w.budget)}</small><button class="tx" data-a="eb">Editar</button></div><small>Período: gastado ${money(T)} · disponible <b style="color:${TA<0?'#B3261E':'inherit'}">${money(TA)}</b> · ${p.weeks.length} ${p.weeks.length==1?'semana':'semanas'}</small></div>`+
 (w.exps.map(e=>`<button class="row" data-a="ee" data-i="${e.id}"><span>${esc(e.desc)}<br><small>${e.at?fs(e.at.slice(0,10)):''}</small></span><span class="sf" style="font-size:20px">${money(e.amount)}</span></button>`).join('')||empty('Sin gastos en esta semana.'))+'<button class="cta" data-a="ae">+ Agregar gasto</button>'}
/* gimnasio */
function gym(){return hd('Mis rutinas','Gimnasio')+(S.routines.map(r=>{const o=open==r.id;return `<div class="grp"><button class="row nb" data-a="ra" data-i="${r.id}"><span><b>${esc(r.name)}</b><br><small>${r.ex.length} ${r.ex.length==1?'ejercicio':'ejercicios'}</small></span><span class="mut">${o?'⌃':'⌄'}</span></button>`+(o?`<div id="exl">${r.ex.map((e,i)=>`<article class="ex" data-i="${e.id}"><button class="hdl" data-h="${r.id}" aria-label="Mover ejercicio">⋮⋮</button><button class="exb" data-a="xe" data-i="${r.id}" data-j="${e.id}"><span class="num">${i+1}</span><span><b style="font-weight:500">${esc(e.name)}</b><small style="display:block">${[e.sets!=null?e.sets+' series':'',e.reps?esc(e.reps)+' reps':'',e.weight!=null?e.weight+' kg':'',e.rir!=null?'RIR '+e.rir:''].filter(Boolean).join(' · ')}</small>${e.notes?`<small style="display:block">${esc(e.notes)}</small>`:''}</span></button></article>`).join('')}</div>`+(r.ex.length?'':empty('Esta rutina todavía no tiene ejercicios.'))+`<div class="acts"><button class="tx" data-a="xn" data-i="${r.id}">+ Agregar ejercicio</button><button class="tx" data-a="re" data-i="${r.id}">Editar rutina</button></div>`:'')+'</div>'}).join('')||empty('Todavía no tenés rutinas registradas.'))+'<button class="cta" data-a="rn">+ Nueva rutina</button>'}
/* suscripciones */
function subsV(){const A=S.subs.filter(s=>s.active),I=S.subs.filter(s=>!s.active),T=A.filter(s=>s.incl),P=s=>s.pays.includes(ymS),sum=l=>l.reduce((a,s)=>a+s.amount,0),
 row=(s,on)=>`<div class="row2${on?'':' off'}"><button class="gr" data-a="se" data-i="${s.id}"><b>${esc(s.name)}</b><small>Vence el ${s.day} · ${money(s.amount)}${s.incl?'':' · fuera del total'}</small>${s.notes?`<small>${esc(s.notes)}</small>`:''}</button>${on?`<button class="chip${P(s)?' ok':''}" data-a="tp" data-i="${s.id}">${P(s)?'Pagada ✓':'Marcar pagada'}</button>`:`<button class="chip" data-a="sa" data-i="${s.id}">Activar</button>`}</div>`;
 return hd('Pagos mensuales','Suscripciones')+`<div class="crow" style="justify-content:center"><button class="tx" data-a="pm" aria-label="Mes anterior">‹</button><b>${mn(ymS+'-01')} ${ymS.slice(0,4)}</b><button class="tx" data-a="nm" aria-label="Mes siguiente">›</button></div>`+
 `<div style="display:flex;justify-content:space-between;align-items:flex-end;padding:8px 0 4px"><div><div class="lb">Pagadas</div><div class="sf" style="font-size:44px;line-height:1">${A.filter(P).length} de ${A.length}</div></div><div style="text-align:right"><div class="lb">Falta pagar</div><b style="font-size:20px;color:var(--ac)">${money(sum(T.filter(s=>!P(s))))}</b></div></div><div style="margin-bottom:8px"><small>Total mensual: ${money(sum(T))}</small></div>`+
 (A.map(s=>row(s,1)).join('')||empty('Todavía no tenés suscripciones activas.'))+(I.length?`<div class="lb" style="margin:18px 0 4px">Inactivas</div>`+I.map(s=>row(s,0)).join(''):'')+'<button class="cta" data-a="sn">+ Agregar suscripción</button>'}
/* ajustes */
const standalone=()=>typeof matchMedia!='undefined'&&(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true);let ip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(view=='a')render()});
let U={checking:false,avail:false,msg:'',err:'',reg:null};
const swOK='serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost');
function settings(){return hd('Mia v'+VERSION,logo(34)+' Ajustes')+
 `<section class="sec"><div class="lb">Semanas</div><small>Día en que empiezan las semanas de un período nuevo. Auto: el mismo día en que empieza el período.</small><div class="wdc" style="margin-top:8px"><button data-a="dw" data-d="" class="${S.wd==null?'on':''}">Auto</button>${[1,2,3,4,5,6,0].map(d=>`<button data-a="dw" data-d="${d}" class="${S.wd===d?'on':''}">${DS[d][0].toUpperCase()+DS[d].slice(1)}</button>`).join('')}</div></section>`+
