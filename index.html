<!doctype html><html lang="es" data-theme="malva"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mia</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F6F2F9"><link rel="icon" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mia"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=malva]{--bg:#F6F2F9;--ink:#2B2336;--mut:#675C77;--ac:#7A5BA6;--line:#DDD2E8;--soft:#E7DFF0}
[data-theme=salvia]{--bg:#F4F6F1;--ink:#24302A;--mut:#5E6B62;--ac:#4F7A63;--line:#D5DDD2;--soft:#DDE5DA}
[data-theme=rosa]{--bg:#FAF2F3;--ink:#35242A;--mut:#765A62;--ac:#A8566A;--line:#EBD5D9;--soft:#F2E0E3}
[data-theme=azul]{--bg:#F1F5F8;--ink:#1F2C38;--mut:#566675;--ac:#4F6F8F;--line:#D3DEE7;--soft:#DCE6EE}
[data-theme=terracota]{--bg:#FAF3EF;--ink:#38251F;--mut:#7A5A50;--ac:#B5573F;--line:#EBD9D0;--soft:#F2E2DA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(120px + env(safe-area-inset-bottom))}
.sf{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.lb{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
h1{font-size:38px;line-height:1.1;margin:0;display:flex;align-items:center;gap:10px}
small,.mut{color:var(--mut);font-size:13px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:8px}
.sec{border-top:1px solid var(--line);padding:16px 0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sh h2{margin:0;font-size:24px;line-height:1.1}
.acts{display:flex;align-items:center}
.big{font-size:46px;line-height:1.1;margin:4px 0}
.sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer;min-height:48px}
.row small{display:block}
.tx{background:none;border:0;color:var(--ac);font-weight:600;min-height:44px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center}
.plus{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--ac);font-size:24px;cursor:pointer;line-height:1}
.plus:disabled{opacity:.4}
.btn{min-height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.chip{min-height:32px;padding:0 12px;border-radius:16px;background:var(--soft);color:var(--ac);font-weight:700;font-size:13px;display:inline-flex;align-items:center}
.chip.bad{background:#FBE4E2;color:#B3261E}
.bar{height:4px;border-radius:2px;background:var(--soft)}.bar i{display:block;height:4px;border-radius:2px;background:var(--ac)}
.sel{height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;padding:0 14px;max-width:200px;font-size:14px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips a{min-height:44px;padding:0 16px;border-radius:22px;background:var(--soft);color:var(--ac);font-weight:600;display:inline-flex;align-items:center}
.row2{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);min-height:56px}
.row2 .gr{flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:8px 0;min-height:44px}.row2 .gr:disabled{opacity:.45}
.row2 .gr b{display:block;font-weight:500}.row2 .gr small{display:block}
.dot{width:44px;height:44px;background:none;border:0;display:grid;place-items:center;cursor:pointer}
.st{width:12px;height:12px;border-radius:6px;background:#B8B2C0;display:block}.st.on{background:#3F8A5A}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);margin:11px;flex:none}
.ex{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--bg)}
.ex.drag{box-shadow:0 8px 24px rgba(0,0,0,.15);position:relative;z-index:2}
.hdl{width:36px;border:0;background:none;color:var(--mut);cursor:grab;touch-action:none;font-size:18px;letter-spacing:-3px}
.exb{flex:1;background:none;border:0;text-align:left;padding:14px 0;cursor:pointer;display:flex;gap:12px;min-width:0}
.num{width:32px;height:32px;border-radius:16px;background:var(--soft);color:var(--ac);font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut)}nav a.on{color:var(--ac);font-weight:700}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;z-index:10;max-height:92dvh;overflow:auto}
.sheet h3{margin:0;font-size:24px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input:not([type=checkbox]),textarea{border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink);min-height:48px;width:100%}
textarea{padding:10px 12px;resize:none}
.bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bt button{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:#fff;cursor:pointer}.bt .pri{background:var(--ac);border:0;color:#fff;font-weight:600}.bt .del{color:#B3261E}
.er{color:#B3261E;font-size:14px;margin:0}
.sw{display:flex;gap:12px;padding:8px 0}.sw button{width:44px;height:44px;border-radius:22px;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--ink)}
.msg{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
</style></head><body><div id="app"><main id="main"></main></div>
<nav id="nav"></nav><div id="sh"></div>
<script>
const VERSION='2.0.0',K='mia-v2',TH=['malva','salvia','rosa','azul','terracota'],THC={malva:'#7A5BA6',salvia:'#4F7A63',rosa:'#A8566A',azul:'#4F6F8F',terracota:'#B5573F'},UYU_USD=41.5;
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({theme:'malva',cash:0,periods:[],sel:null,routines:[],subs:[],seq:1},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},nid=()=>S.seq++,
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
money=n=>'$ '+Math.round(n||0).toLocaleString('es-UY'),pad=n=>String(n).padStart(2,'0'),
iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date()),pd=v=>new Date(v+'T00:00:00'),
addD=(v,n)=>{const d=pd(v);d.setDate(d.getDate()+n);return iso(d)},addM=v=>{const d=pd(v);d.setMonth(d.getMonth()+1);return iso(d)},
fd=v=>new Intl.DateTimeFormat('es-UY',{day:'2-digit',month:'short',year:'numeric'}).format(pd(v));
document.documentElement.dataset.theme=S.theme;
const SP=(()=>{let d='';for(let t=.3;t<=13;t+=.2){const r=(1.6*t+1)*1.55;d+=(d?'L':'M')+(46.1+r*Math.cos(t)).toFixed(1)+' '+(53.9+r*Math.sin(t)).toFixed(1)}return d})();
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${SP}"/></svg>`;
const ico=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const NAV=[['','Inicio','<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],['expenses','Gastos','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'],['workouts','Gimnasio','<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'],['subscriptions','Suscripciones','<path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"/>'],['settings','Ajustes','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>']];
/* ---- datos ---- */
const cp=()=>{const t=today(),s=[...S.periods].sort((a,b)=>b.start.localeCompare(a.start));return s.find(p=>p.start<=t&&t<=p.end)||s[0]||null},
fixSel=()=>{if(!S.periods.some(p=>p.id==S.sel))S.sel=cp()?.id??null},
sp=w=>w.exps.reduce((a,e)=>a+e.amount,0),av=w=>w.budget-sp(w),
nextN=p=>p.weeks.length?Math.max(...p.weeks.map(w=>w.n))+1:1,
curW=p=>{if(!p||!p.weeks.length)return null;const n=Math.min(5,Math.floor((pd(today())-pd(p.start))/864e5/7)+1);return p.weeks.find(w=>w.n==n)||[...p.weeks].reverse().find(w=>w.n<n)||p.weeks[0]},
paid=s=>s.paid===today().slice(0,7),subTot=()=>S.subs.filter(s=>s.active&&s.incl).reduce((a,s)=>a+s.amount,0),
wk=(pi,n)=>S.periods.find(p=>p.id==pi)?.weeks.find(w=>w.n==n);
/* ---- piezas ---- */
const hd=(lb,t,r='')=>`<div class="ph"><div><div class="lb">${lb}</div><h1 class="sf">${t}</h1></div><div>${r}</div></div>`,
plus=(a,l,x='',dis)=>`<button class="plus" data-a="${a}" ${x} aria-label="${l}" ${dis?'disabled':''}>+</button>`,
sec=(lb,t,acts,body)=>`<section class="sec"><div class="sh"><div><div class="lb">${lb}</div><h2 class="sf">${t}</h2></div><div class="acts">${acts}</div></div>${body}</section>`,
more=(a,o)=>`<button class="tx" data-a="${a}">${o?'Ocultar':'Mostrar'}</button>`,
empty=t=>`<p class="mut">${t}</p>`;
let ex1=false,ex2=false,cashEd=false;
/* ---- inicio ---- */
function expRows(p,w){return w.exps.map(e=>`<button class="row" data-a="ee" data-p="${p.id}" data-w="${w.n}" data-i="${e.id}"><span>${esc(e.desc)}</span><b>${money(e.amount)}</b></button>`).join('')||empty('Todavía no registraste gastos.')}
function expCard(){const p=cp(),w=curW(p);
 const b=w?`<div class="lb">Disponible</div><div class="sf big" style="color:${av(w)<0?'#B3261E':'var(--ink)'}">${money(av(w))}</div><small>Presupuesto: ${money(w.budget)}</small>`+(ex1?`<div class="sub">Esta semana · ${w.exps.length} ${w.exps.length==1?'gasto':'gastos'}</div>${expRows(p,w)}`:''):empty('Todavía no configuraste el mes actual.')+'<a class="btn" href="#/expenses">Configurar mes</a>';
 return sec('Gastos',w?'Semana '+w.n:'Sin semana activa',(w?plus('ae','Agregar gasto',`data-p="${p.id}" data-w="${w.n}"`)+more('x1',ex1):'')+'<a class="tx" href="#/expenses" aria-label="Ver todos los gastos">›</a>',b)}
function subCard(){const a=S.subs.filter(s=>s.active),n=a.filter(s=>s.incl).map(s=>esc(s.name)).join(' · ')||'Ninguna incluida';
 const b=`<div class="lb">Total mensual</div><div class="sf big">${money(subTot())}</div><small>${n}</small>`+(ex2?`<div class="sub">Este mes · ${a.length} ${a.length==1?'suscripción':'suscripciones'}</div>`+(a.map(s=>`<label class="row2" style="color:var(--ink);font-size:16px"><input type="checkbox" data-a="tp" data-i="${s.id}" ${paid(s)?'checked':''}><span class="gr"><b>${esc(s.name)}</b><small>Cobra el día ${s.day}</small></span><b>${money(s.amount)}</b></label>`).join('')||empty('Sin suscripciones activas.')):'');
 return sec('Suscripciones',S.subs.length+(S.subs.length==1?' registrada':' registradas'),plus('sn','Agregar suscripción')+more('x2',ex2)+'<a class="tx" href="#/subscriptions" aria-label="Administrar suscripciones">›</a>',b)}
const rChips=()=>S.routines.length?`<div class="chips">${S.routines.map(r=>`<a href="#/workouts/${r.id}">${esc(r.name)} ›</a>`).join('')}</div>`:empty('Todavía no tenés rutinas registradas.')+'<button class="btn" data-a="rn">Crear rutina</button>';
const home=()=>hd('Tu resumen',logo(34)+' Mia')+expCard()+subCard()+sec('Gimnasio','Tus rutinas',plus('rn','Agregar rutina')+'<a class="tx" href="#/workouts" aria-label="Ver rutinas">›</a>',rChips());
/* ---- gastos ---- */
function expenses(){const p=S.periods.find(x=>x.id==S.sel),per=[...S.periods].sort((a,b)=>b.start.localeCompare(a.start));
 const sel=`<select class="sel" data-a="sp" aria-label="Período">${per.map(x=>`<option value="${x.id}" ${x.id==S.sel?'selected':''}>${fd(x.start)} – ${fd(x.end)}</option>`).join('')||'<option>Sin períodos</option>'}</select>`;
 let h=hd('Resumen del período seleccionado','Gastos',sel);
 const w=curW(p),nn=p?nextN(p):1;
 h+=`<section class="sec"><div class="sh"><div><div class="lb">Período</div><h2 class="sf" style="font-size:20px">${p?fd(p.start)+' – '+fd(p.end):'Sin período'}</h2></div>${plus('ap','Agregar período')}</div>`+(p?(w?`<small>Semana actual: <b>${w.n}</b> · Presupuesto ${money(w.budget)}</small>`:empty('Este período todavía no tiene semanas.'))+'<div style="margin-top:8px">'+(nn<=5?`<button class="btn" data-a="aw">Semana ${nn}</button>`:'<span class="chip">Completo</span>')+'</div>':empty('Todavía no creaste ningún período.')+'<button class="btn" data-a="ap">Crear período</button>')+'</section>';
 if(!p)return h;
 const t=p.weeks.reduce((a,x)=>a+sp(x),0),ta=p.weeks.reduce((a,x)=>a+av(x),0);
 h+=`<section class="sec"><div class="lb">Resumen del período · ${p.weeks.length} ${p.weeks.length==1?'semana registrada':'semanas registradas'}</div><div class="g2" style="margin-top:6px"><div><small>Gastado</small><div class="sf" style="font-size:30px">${money(t)}</div></div><div><small>Disponible</small><div class="sf" style="font-size:30px;color:${ta<0?'#B3261E':'var(--ac)'}">${money(ta)}</div></div></div></section>`;
 return h+(p.weeks.map(x=>`<section class="sec"><div class="sh"><div><h2 class="sf">Semana ${x.n}</h2><small>Presupuesto: ${money(x.budget)}</small></div><div class="acts"><span class="chip ${av(x)<0?'bad':''}">${money(av(x))}</span>${plus('ae','Agregar gasto',`data-p="${p.id}" data-w="${x.n}"`)}</div></div>${expRows(p,x)}</section>`).join('')||empty('No hay semanas registradas para este período.'));
}
/* ---- suscripciones ---- */
function subsV(){const a=S.subs.filter(s=>s.active).length,i=S.subs.filter(s=>s.active&&s.incl).length;
 return hd('Administrá tus pagos mensuales','Suscripciones',plus('sn','Agregar suscripción'))+`<section class="sec"><div class="lb">Total mensual</div><div class="sf big">${money(subTot())}</div><div class="g2"><small>Activas: <b>${a}</b></small><small>Incluidas en el total: <b>${i}</b></small></div></section><section class="sec"><div class="sh"><h2 class="sf">Todas</h2><small>Tocá una para editar</small></div>`+(S.subs.map(s=>`<div class="row2"><button class="dot" data-a="sa" data-i="${s.id}" aria-pressed="${s.active}" aria-label="${s.active?'Desactivar':'Activar'} suscripción"><i class="st ${s.active?'on':''}"></i></button><button class="gr" data-a="se" data-i="${s.id}" ${s.active?'':'disabled'}><b>${esc(s.name)}</b><small>Día ${s.day} · ${money(s.amount)}</small>${s.notes?`<small>${esc(s.notes)}</small>`:''}</button><input type="checkbox" data-a="si" data-i="${s.id}" ${s.incl?'checked':''} ${s.active?'':'disabled'} title="Incluir en el total" aria-label="Incluir en el total"><button class="tx" data-a="sd" data-i="${s.id}" aria-label="Eliminar suscripción" style="color:#B3261E">✕</button></div>`).join('')||empty('Todavía no tenés suscripciones.'))+'</section>';
}
/* ---- gimnasio ---- */
const wlist=()=>hd('Tus rutinas','Gimnasio',plus('rn','Agregar rutina'))+'<section class="sec">'+(S.routines.map(r=>`<a class="row" href="#/workouts/${r.id}"><span><b>${esc(r.name)}</b><small>${r.ex.length} ${r.ex.length==1?'ejercicio':'ejercicios'}</small></span><span class="mut">›</span></a>`).join('')||empty('Todavía no tenés rutinas registradas.')+'<button class="btn" data-a="rn">Crear rutina</button>')+'</section>';
function wdet(id){const r=S.routines.find(x=>x.id==id);if(!r){location.hash='#/workouts';return ''}
 return `<a class="tx" href="#/workouts" style="margin-left:-8px">‹ Rutinas</a>`+hd('Rutina',esc(r.name),`<button class="tx" data-a="re" data-i="${r.id}">Editar</button>`)+`<section class="sec"><div class="sh"><div><div class="lb">Entrenamiento</div><b>${r.ex.length} ${r.ex.length==1?'ejercicio':'ejercicios'}</b></div>${plus('xn','Agregar ejercicio',`data-i="${r.id}"`)}</div><div id="exl">`+(r.ex.map((e,i)=>`<article class="ex" data-i="${e.id}"><button class="hdl" data-h="${r.id}" aria-label="Mover ejercicio">⋮⋮</button><button class="exb" data-a="xe" data-i="${r.id}" data-j="${e.id}"><span class="num">${i+1}</span><span><b>${esc(e.name)}</b><small style="display:block">${[e.sets!=null?e.sets+' series':'',e.reps?esc(e.reps)+' reps':'',e.weight!=null?e.weight+' kg':''].filter(Boolean).join(' · ')}</small>${e.notes?`<small style="display:block">${esc(e.notes)}</small>`:''}</span></button></article>`).join('')||empty('Esta rutina todavía no tiene ejercicios.'))+'</div></section>'}
/* ---- ajustes ---- */
let U={checking:false,avail:false,msg:'',err:'',reg:null};
const swOK='serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost');
function settings(){return hd('Mia v'+VERSION,'Ajustes')+
 `<section class="sec"><div class="lb">Color</div><div class="sw">${TH.map(t=>`<button data-a="th" data-t="${t}" class="${S.theme==t?'on':''}" style="background:${THC[t]}" aria-label="Color ${t}"></button>`).join('')}</div></section>`+
 `<section class="sec"><div class="sh"><div><div class="lb">Actualizaciones</div><small>Buscá una versión nueva sin volver a instalar la PWA.</small></div>${U.avail?'<span class="chip">Disponible</span>':''}</div>${swOK?'':'<div class="msg">La búsqueda de actualizaciones solo funciona en la versión desplegada de la PWA.</div>'}${U.msg?`<div class="msg">${U.msg}</div>`:''}${U.err?`<p class="er">${U.err}</p>`:''}<div class="acts" style="gap:8px"><button class="btn o" data-a="chk" ${!swOK||U.checking?'disabled':''}>${U.checking?'Buscando...':'Buscar actualización'}</button>${U.avail?'<button class="btn" data-a="inst">Actualizar ahora</button>':''}</div></section>`+
 `<section class="sec"><div class="sh"><div><div class="lb">Caja</div>${cashEd?`<div class="sf" style="font-size:34px">$ <input data-a="ci" type="number" inputmode="decimal" min="0" step="1" value="${S.cash||''}" style="width:170px;font:inherit;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:0;min-height:44px" autofocus></div>`:`<button class="tx" data-a="ce" style="padding:0;font-size:34px;color:var(--ink)"><span class="sf">${money(S.cash)}</span></button>`}</div><div style="text-align:right"><small>Aproximadamente</small><div><b>US$ ${(S.cash/UYU_USD).toFixed(2)}</b></div></div></div></section>`+
 `<section class="sec"><div class="lb">Respaldo</div><small>Tus datos viven solo en este dispositivo. Guardá una copia de vez en cuando.</small><div class="acts" style="gap:8px;margin-top:8px"><button class="btn o" data-a="exp">Exportar</button><label class="btn o" style="cursor:pointer;color:var(--ink);font-size:16px">Importar<input type="file" accept="application/json" data-a="imp" hidden></label></div></section>`}
/* ---- router ---- */
